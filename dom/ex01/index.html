<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
            padding: 0;
            margin: 0;
        }

        main {
            background-color: aquamarine;
        }

        div {
            background-color: lightgray;
            text-align: center;
            width: 300px;
            margin: 5px;
            padding: 5px;
            border-radius: 5px;
            border: 4px solid darkgray;
        }

        div#escuro {
            background-color: grey;
            color: white;
        }

        div:hover, #escuro:hover {
            border-color: red;
            cursor: pointer;
        }

        .selecionado {
            background-color: red;
            color: white;
        }
    </style>
</head>
<body>
    <main>
        <div class="curso">HTML</div>
        <div class="curso">CSS</div>
        <div class="curso">Javascript</div>
        <div class="curso">PHP</div>
        <div class="curso">React</div>
        <div class="curso">MySQL</div>
        <div id="escuro" class="curso">C++</div>
        <div id="escuro" class="curso">C#</div>
        <div id="escuro" class="curso">Arduino</div>
        <div id="escuro" class="curso">React Native</div>
        <div id="escuro" class="curso">Python</div>
        <div id="escuro" class="curso">Raspberry</div>
    </main>
    <script src="script.js"></script>
</body>
</html>
