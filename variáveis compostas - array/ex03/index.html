<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Adicionando valores</h1>
    <form action="">
        <p>
            <label for="inumero">Adicione o número</label>
            <input type="number" name="numero" id="inumero">
            <input type="button" value="Enviar" onclick="clicar()">
        </p>
    </form>
    <div id="res"></div>
    <script>
        let num = document.querySelector('#inumero')
        let res = document.querySelector('#res')
        let valores = []

        function eNumero(n) {
            if (Number(n) >= 1 && Number(n) <=10) {
                return true
            } else {
                return false
            }
        }

        function estaNaRes(n, l) {
            if (l.indexOf(n) != -1) {
                return true
            } else {
                return false
            }
        }

        function clicar() {
            if (eNumero(num.value) && !estaNaRes(num.value, valores)) {
                valores.push(Number(num.value))
                res.innerHTML = ''

                for(let pos in valores) {
                    res.innerHTML += `<p>número ${valores[pos]} adicionado.</p>` 
                }

            } else {
                window.alert('Número inválido ou existente!')
            }
        }


    </script>
</body>
</html>
